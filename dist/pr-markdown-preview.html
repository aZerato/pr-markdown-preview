<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>PR Markdown Preview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Styles principaux (issus de ta base, allégés) -->
  <style>
    /* Mise en page: 2 zones de preview + barre d'options + diff */
    .compare-wrapper { display: grid; gap: 0.8rem; }
    .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
    @media (max-width: 960px) { .editor-grid { grid-template-columns: 1fr; } }
    .editor-card { border: 1px solid #e0e0e0; border-radius: 6px; background: #fff; }
    .editor-card header { padding: .6rem .8rem; font-weight: 600; border-bottom: 1px solid #e0e0e0; background: rgba(0,0,0,.03); }
    .options-bar { display:flex; flex-wrap:wrap; gap:.8rem; align-items:center; justify-content:space-between;
      padding:.6rem .8rem; border:1px solid #e0e0e0; border-radius:6px; background: rgba(0,0,0,.03); }
    .options-left,.options-right { display:flex; gap:.8rem; align-items:center; }
    .diff-card { border:1px solid #e0e0e0; border-radius:6px; overflow:hidden; }
    .md-typeset { line-height: 1.55; }
    /* Un peu d’air autour du contenu rendu */
    #preview-left, #preview-right { padding:.8rem; min-height: 120px; }
  </style>

  <!-- Styles Diff2Html + Highlight.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html/bundles/css/diff2html.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/default.min.css">
</head>
<body>
  <div class="compare-wrapper">
    <div class="options-bar">
      <div class="options-left">
        <label>Fichier Markdown :
          <select id="file-picker"></select>
        </label>
        <label>Vue du diff :
          <select id="view-mode">
            <option value="line-by-line">Ligne par ligne</option>
            <option value="side-by-side">Côte à côte</option>
          </select>
        </label>
        <label title="Supprime les espaces inutiles avant diff">
          <input type="checkbox" id="ignore-ws" checked> Ignorer espaces
        </label>
        <label title="Ignore la casse avant diff">
          <input type="checkbox" id="ignore-case"> Ignorer la casse
        </label>
      </div>
      <div class="options-right">
        <small id="status" style="opacity:.75"></small>
      </div>
    </div>

    <div class="editor-grid">
      <section class="editor-card">
        <header>Rendu HTML (branche source)</header>
        <div id="preview-left" class="md-typeset"></div>
      </section>
      <section class="editor-card">
        <header>Rendu HTML (branche cible)</header>
        <div id="preview-right" class="md-typeset"></div>
      </section>
    </div>

    <section class="diff-card">
      <div id="diff-output"></div>
    </section>
  </div>

  <!-- Librairies UMD (chargées SANS type="module") -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/diff@5.2.0/dist/diff.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/diff2html/bundles/js/diff2html.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>

  <!-- SDK ADO et application (module) -->
  <script type="module">
    import * as SDK from "https://unpkg.com/azure-devops-extension-sdk@4.2.0/esm/SDK.js";

    // ==== Helpers DOM
    const $ = (sel) => document.querySelector(sel);
    const els = {
      filePicker: $('#file-picker'),
      viewMode:   $('#view-mode'),
      ignoreWs:   $('#ignore-ws'),
      ignoreCase: $('#ignore-case'),
      status:     $('#status'),
      diff:       $('#diff-output'),
      left:       $('#preview-left'),
      right:      $('#preview-right')
    };

    // ==== Rendu Markdown -> HTML (sécurisé)
    marked.setOptions({ gfm:true, breaks:false, headerIds:true, mangle:false });

    // ==== Normalisation simple du HTML avant diff textuel
    function normalizeHtml(html, { ignoreWs, ignoreCase }) {
      let s = html ?? "";
      if (ignoreWs) {
        s = s.replace(/\>\s+\</g, "><");     // supprime les espaces entre balises
        s = s.replace(/[ \t]+/g, " ");       // compresse espaces
        s = s.split('\n').map(l => l.trim()).join('\n'); // trim par ligne
      }
      if (ignoreCase) s = s.toLowerCase();
      return s.trim();
    }

    // Ajoute Accept: application/json et le Bearer token ADO
    async function adoFetch(url, options = {}) {
        const token = await SDK.getAccessToken();
        options.headers = {
          ...options.headers,
          'Authorization': `Bearer ${token}`, //
          'Content-Type': 'application/json' // Common header for JSON APIs
        };
        return fetch(url, options);
    }

    // Parse JSON "safe" : si pas JSON, on logge le début de la réponse
    async function readJsonOrThrow(r, requestUrl) {
        const ctype = r.headers.get("content-type") || "";
        const body = await r.text(); // on lit toujours le texte pour log/erreur
        if (!r.ok) {
            throw new Error(`HTTP ${r.status} on ${requestUrl}\n${body.slice(0, 400)}`);
        }
        if (!ctype.includes("application/json")) {
            throw new Error(`Réponse non-JSON (Content-Type="${ctype}") sur ${requestUrl}\n${body.slice(0, 400)}`);
        }
        try { return JSON.parse(body); }
        catch (e) { throw new Error(`Parse JSON échoué sur ${requestUrl}\n${body.slice(0, 400)}`); }
    }

    // ==== API: lister les fichiers .md modifiés à la dernière itération
    async function listMdFilesBetweenCommits(orgUrl, project, repoId, baseCommit, targetCommit) {
      const u = new URL(`${orgUrl}/${project}/_apis/git/repositories/${repoId}/diffs/commits`);
        u.searchParams.set("api-version", "7.1");
        u.searchParams.set("baseVersion", baseCommit);
        u.searchParams.set("baseVersionType", "commit");
        u.searchParams.set("targetVersion", targetCommit);
        u.searchParams.set("targetVersionType", "commit");

        const r = await adoFetch(u.toString());
        const j = await readJsonOrThrow(r, u.toString()); // <-- remplace r.json()

        const paths = (j.changes || [])
            .map(ch => ch?.item?.path || ch?.newPath || ch?.oldPath)
            .filter(p => typeof p === "string");

        const md = paths.filter(p => /\.m(?:d|arkdown)$/i.test(p));
        return Array.from(new Set(md));
    }

    // ==== API: lire le contenu d'un fichier à un commit donné
    async function readFileAtCommit(orgUrl, project, repoId, path, commitId) {
      const u = new URL(`${orgUrl}/${project}/_apis/git/repositories/${repoId}/items`);
      u.searchParams.set("path", path);
      u.searchParams.set("includeContent", "true");
      u.searchParams.set("api-version", "7.1");
      u.searchParams.set("versionDescriptor.versionType", "commit");
      u.searchParams.set("versionDescriptor.version", commitId);

      const r = await adoFetch(u.toString());
      if (!r.ok) throw new Error(`Items/Get failed ${r.status}`);
      const j = await readJsonOrThrow(r, u.toString());
      if (typeof j.content === "string") return j.content;
      if (Array.isArray(j.content)) return new TextDecoder().decode(Uint8Array.from(j.content));
      return "";
    }

    // ==== Rendu d'un fichier: previews + diff
    async function renderFile(ctx, path) {
      els.status.textContent = `Chargement ${path}…`;
      const t0 = performance.now();

      const [mdLeft, mdRight] = await Promise.all([
        readFileAtCommit(ctx.orgUrl, ctx.project, ctx.repoId, path, ctx.srcCommit),
        readFileAtCommit(ctx.orgUrl, ctx.project, ctx.repoId, path, ctx.tgtCommit),
      ]);

      const htmlLeft  = DOMPurify.sanitize(marked.parse(mdLeft || ""));
      const htmlRight = DOMPurify.sanitize(marked.parse(mdRight || ""));

      els.left.innerHTML  = htmlLeft;
      els.right.innerHTML = htmlRight;

      // Diff textuel (sur HTML normalisé)
      const options = { ignoreWs: els.ignoreWs.checked, ignoreCase: els.ignoreCase.checked };
      const normLeft  = normalizeHtml(htmlLeft,  options);
      const normRight = normalizeHtml(htmlRight, options);

      const patch = window.Diff.createTwoFilesPatch(
        "target.html", "source.html", normRight, normLeft, "", "", { context: 3 }
      );

      const diffHtml = window.Diff2Html.html(patch, {
        drawFileList: false,
        matching: 'lines',
        outputFormat: els.viewMode.value // 'line-by-line' ou 'side-by-side'
      });

      els.diff.innerHTML = diffHtml;
      if (window.hljs) window.hljs.highlightAll();

      const t1 = performance.now();
      els.status.textContent = `Rendu ${path} en ${Math.round(t1 - t0)} ms • ${els.viewMode.value}`;
    }

    // ==== Initialisation
    SDK.init();
    SDK.ready().then(async () => {
      try {
        // Contexte PR depuis la configuration (recommandé pour onglets PR)
        const cfg = SDK.getConfiguration();
        const pr  = cfg?.pullRequest ?? cfg?._pullRequest ?? {};
        const prId      = pr.pullRequestId ?? cfg.pullRequestId;
        const repoId    = pr.repository?.id ?? cfg.repositoryId;
        const projectId = pr.repository?.project?.id ?? cfg.projectGuid;
        const project   = pr.repository?.project?.name;
        const repoName  = pr.repository?.name;

        const srcCommit = pr.lastMergeSourceCommit?.commitId ?? cfg.lastMergeSourceCommitId;
        const tgtCommit = pr.lastMergeTargetCommit?.commitId ?? cfg.lastMergeTargetCommitId;

        // URL d'orga via WebContext (fiable)
        const web   = SDK.getWebContext();
        const orgUrl = "https://dev.azure.com/";

        if (!prId || !repoId || !project || !srcCommit || !tgtCommit) {
          els.status.textContent = "Contexte PR incomplet (configuration).";
          return;
        }

        const ctx = { orgUrl, project, repoId, prId, srcCommit, tgtCommit };

        // Itération: on prend la plus récente exposée par la page (quand dispo), sinon 1
        const iterationId = cfg.pullRequestPageVersion || 1;

        // Liste les fichiers .md modifiés
        const files = await listMdFilesBetweenCommits(orgUrl, project, repoId, ctx.tgtCommit, ctx.srcCommit)

        // Pré-sélection via ?path= dans l'URL parente (si présent)
        let preferred = "";
        try {
          const ref = new URL(document.referrer);
          preferred = ref.searchParams.get("path") || "";
        } catch {}

        // Alimente le picker
        if (files.length) {
          els.filePicker.innerHTML = files.map(p => `<option value="${p}">${p}</option>`).join("");
          // si ?path= correspond, le sélectionner
          if (preferred && files.includes(preferred)) els.filePicker.value = preferred;
          await renderFile(ctx, els.filePicker.value);
        } else {
          els.filePicker.innerHTML = `<option value="">(aucun .md modifié)</option>`;
          els.status.textContent = "Aucun fichier Markdown détecté dans cette PR.";
        }

        // Événements UI
        els.filePicker.addEventListener("change", () => renderFile(ctx, els.filePicker.value));
        els.viewMode.addEventListener("change", () => renderFile(ctx, els.filePicker.value));
        els.ignoreWs.addEventListener("change", () => renderFile(ctx, els.filePicker.value));
        els.ignoreCase.addEventListener("change", () => renderFile(ctx, els.filePicker.value));

        // Ajuste la hauteur de l'iframe côté hôte
        const resize = () => SDK.resize();
        new ResizeObserver(resize).observe(document.body);
        resize();

      } catch (e) {
        console.error(e);
        els.status.textContent = "Erreur d'initialisation. Voir la console.";
      }
    });
  </script>
</body>
</html>
``
